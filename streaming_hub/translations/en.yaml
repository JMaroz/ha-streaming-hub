---
configuration:
  log_level:
    name: "Log Level"
    description: "Controls the verbosity of the add-on logs."
  country:
    name: "Country Code for Streaming Availability"
    description: "ISO 3166-1 country code (e.g. IT, US, GB, FR, DE, ES) to determine availability on Netflix, Prime Video, Disney+, etc."
  custom_sources:
    name: "Custom Streaming Sources"
    description: >-
      List of website URLs for your media sources. Type (reactive or crawler)
      can be set to auto for automatic detection.
  custom_dns:
    name: "DNS-over-HTTPS Mode"
    description: "DNS resolution method to bypass local ISP censorship (Cloudflare, Google, Quad9, or system)."
  tmdb_api_key:
    name: "TMDb API Key"
    description: "Optional The Movie Database API key for high-resolution posters, backdrops, and plots."
  stream_port:
    name: "Stream Proxy Port"
    description: "HTTP port used to serve proxied HLS video streams on the local network."
  profiles:
    name: "Family Account Profiles"
    description: >-
      List of family members/profiles. Each profile has individual lists (In Progress, Watched, Favorites),
      age rating filter, and personal TMDb / Trakt.tv credentials.
